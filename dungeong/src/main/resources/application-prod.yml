# ==========================================
# [운영 환경] Production Profile
# ==========================================

# ------------------------------------------
# 1. Spring 기본 설정 (DB, JPA, AWS, Flyway)
# ------------------------------------------
spring:
  config:
    activate:
      on-profile: prod

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  datasource:
    url: jdbc:postgresql://localhost:5432/dreamshow_db
    username: ${DB_USERNAME:dreamshow_user}
    password: ${DB_PASSWORD}

  jpa:
    properties:
      hibernate:
        show_sql: false
        format_sql: false

  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY}
        secret-key: ${AWS_SECRET_KEY}
      region:
        static: ap-northeast-2
      s3:
        bucket: ${AWS_S3_BUCKET}

  # ------------------------------------------
  # 2. OAuth2 & Mail 설정 (Spring 하위로 이동)
  # ------------------------------------------
  security:
    oauth2:
      client:
        registration:
          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            client-name: Naver
            authorization-grant-type: authorization_code
            redirect-uri: https://dreamshowchoir.ulsan.kr/login/oauth2/code/naver
            scope: name,email,profile_image
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-name: Kakao
            authorization-grant-type: authorization_code
            redirect-uri: https://dreamshowchoir.ulsan.kr/login/oauth2/code/kakao
            scope: profile_nickname,account_email,profile_image
            client-authentication-method: client_secret_post
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  mail:
    host: smtp.gmail.com
    port: 587
    username: dreamshowchoir0524@gmail.com
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# ==========================================
# 3. 프론트엔드 리다이렉트 (Root Level)
# ==========================================
frontend:
  redirect-url: https://dreamshowchoir.ulsan.kr/oauth/callback
  error-url: https://dreamshowchoir.ulsan.kr/auth/error

# ==========================================
# 4. 로깅 설정 (Root Level)
# ==========================================
logging:
  level:
    root: INFO
    kr.ulsan.dreamshowchoir: INFO
  file:
    name: logs/dreamshow.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7

# ==========================================
# 5. 커스텀 설정 (Root Level)
# ==========================================
jwt:
  secret-key: ${JWT_SECRET_KEY}
  token-validity-in-milliseconds: 3600000
  refresh-token-validity-in-milliseconds: 1209600000

recaptcha:
  secret-key: ${RECAPTCHA_SECRET_KEY}

google:
  calendar:
    credentials-path: ${GOOGLE_CREDENTIALS_PATH:/home/ubuntu/secrets/google-credentials.json}
    practice-id: ${GOOGLE_CALENDAR_PRACTICE_ID}
    performance-id: ${GOOGLE_CALENDAR_PERFORMANCE_ID}