name: Deployment images

on:
  push:
    paths:
      - frontend/**
      - dungeong/**
      - compose.yaml
      - deploy/**
      - .github/workflows/deployment-images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate Compose configuration
        env:
          IMAGE_TAG: ${{ github.sha }}
          POSTGRES_VERSION: '16'
          POSTGRES_USER: compose_check
          POSTGRES_PASSWORD: fixture-only
        run: docker compose config --quiet

      - name: Set image prefix
        run: printf 'IMAGE_PREFIX=ghcr.io/%s\n' "${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build Next.js image
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://dreamshowchoir.ulsan.kr' }}
          NEXT_PUBLIC_GOOGLE_CALENDAR_API_KEY: ${{ vars.NEXT_PUBLIC_GOOGLE_CALENDAR_API_KEY }}
          NEXT_PUBLIC_GOOGLE_CALENDAR_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CALENDAR_ID }}
          NEXT_PUBLIC_GOOGLE_PRACTICE_CALENDAR_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_PRACTICE_CALENDAR_ID }}
          NEXT_PUBLIC_IMAGE_BASE_URL: ${{ vars.NEXT_PUBLIC_IMAGE_BASE_URL }}
          NEXT_PUBLIC_LIVERE_UID: ${{ vars.NEXT_PUBLIC_LIVERE_UID }}
          NEXT_PUBLIC_NAVER_MAP_CLIENT_ID: ${{ vars.NEXT_PUBLIC_NAVER_MAP_CLIENT_ID }}
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ vars.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}
        run: |
          docker build --platform linux/amd64 \
            --build-arg NEXT_PUBLIC_API_URL \
            --build-arg NEXT_PUBLIC_GOOGLE_CALENDAR_API_KEY \
            --build-arg NEXT_PUBLIC_GOOGLE_CALENDAR_ID \
            --build-arg NEXT_PUBLIC_GOOGLE_PRACTICE_CALENDAR_ID \
            --build-arg NEXT_PUBLIC_IMAGE_BASE_URL \
            --build-arg NEXT_PUBLIC_LIVERE_UID \
            --build-arg NEXT_PUBLIC_NAVER_MAP_CLIENT_ID \
            --build-arg NEXT_PUBLIC_RECAPTCHA_SITE_KEY \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --tag "$IMAGE_PREFIX/frontend:$GITHUB_SHA" frontend

      - name: Build Spring Boot image
        run: |
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --tag "$IMAGE_PREFIX/backend:$GITHUB_SHA" dungeong

      - name: Publish images to GHCR
        if: github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE_PREFIX/frontend:$GITHUB_SHA"
          docker push "$IMAGE_PREFIX/backend:$GITHUB_SHA"
