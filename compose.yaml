services:
  frontend:
    image: ${IMAGE_PREFIX:-ghcr.io/dungeong/dreamshowchoir-homepage}/frontend:${IMAGE_TAG:?Set IMAGE_TAG to a built commit SHA}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"

  backend:
    image: ${IMAGE_PREFIX:-ghcr.io/dungeong/dreamshowchoir-homepage}/backend:${IMAGE_TAG:?Set IMAGE_TAG to a built commit SHA}
    restart: unless-stopped
    env_file:
      - path: ${BACKEND_ENV_FILE:-./deploy/config/backend.env}
        required: false
        format: raw
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/run/dreamshowchoir/
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-dreamshow_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: ${BACKEND_CONFIG_DIR:-./deploy/config}
        target: /run/dreamshowchoir
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:${POSTGRES_VERSION:?Set POSTGRES_VERSION to match the existing major version}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dreamshow_db}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
